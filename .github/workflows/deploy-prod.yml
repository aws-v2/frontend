name: CI - Test and PR to Staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write


jobs:
  prod-full-suite:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run test




  prod-build-image:
    runs-on: ubuntu-latest
    needs: prod-full-suite
    if: github.event_name == 'push'
    steps:

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/frontend-server:prod
          build-args: |
            VITE_APP_PROFILE=prod
            VITE_API_BASE_URL=http://localhost:8080/api/v1/change-me


  prod-deploy:
    needs: prod-build-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Production via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e

            echo "Initializing Docker Swarm (if not already)..."
            docker swarm init || true

            echo "Creating overlay network (if not exists)..."
            docker network create --driver overlay aws-prod-network || true

            echo "Pulling latest frontend image..."
            docker pull qarani/frontend-server:prod

            echo "Removing old service (if exists)..."
            docker service rm frontend-server-prod || true

            echo "Deploying frontend as a Swarm service..."

            docker service create \
              --name frontend-server-prod \
              --network aws-prod-network \
              --env API_GATEWAY_HOST=api-gateway-prod \
              --constraint 'node.role == cloud' \
              --mount type=bind,source=/opt/frontend/config-prod.json,target=/usr/share/nginx/html/config.json,readonly \
              --publish 5173:80 \
              qarani/frontend-server:prod

            echo "Listing services..."
            docker service ls

            echo "Checking service tasks..."
            docker service ps frontend-server-prod